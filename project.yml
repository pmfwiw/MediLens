name: MediLens
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.29.0
targets:
  MediLens:
    type: application
    platform: iOS
    sources:
      - path: MediLens
        excludes: ["Data/Resources/pills.sqlite"]
      - path: MediLens/Data/Resources/pills.sqlite
        buildPhase: resources
    dependencies:
      - package: GRDB
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    info:
      path: MediLens/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "알약 사진을 촬영해 의약품을 식별하기 위해 카메라를 사용합니다."
        DataGoKrKey: $(DATA_GO_KR_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MediLens
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
  MediLensTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MediLensTests]
    dependencies:
      - target: MediLens
